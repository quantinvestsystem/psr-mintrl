[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psr-mintrl"
version = "1.0.0"
description = "Probabilistic Sharpe Ratio and Minimum Track Record Length per trade (Bailey & López de Prado, 2012)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["sharpe ratio", "probabilistic sharpe ratio", "backtest", "trading", "statistics", "mql5", "metatrader"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Calculator = "https://quantinvest.co/tools/psr-calculator/"

[tool.setuptools]
packages = ["psr_mintrl"]
